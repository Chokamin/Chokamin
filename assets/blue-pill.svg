<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 138 60" width="138" height="60" role="img" aria-label="email">
  <defs>
    <clipPath id="pill"><rect x="10" y="10" width="118" height="40" rx="20.0" /></clipPath>
    <!-- same dark glass as the terminal window -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b120d" />
      <stop offset="1" stop-color="#020703" />
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy="1" r=".75">
      <stop offset="0" stop-color="#5b9bff" stop-opacity=".45" />
      <stop offset="1" stop-color="#5b9bff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#fff" stop-opacity=".55" />
      <stop offset=".45" stop-color="#5b9bff" stop-opacity=".35" />
      <stop offset="1"   stop-color="#5b9bff" stop-opacity=".95" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#fff" stop-opacity=".28" />
      <stop offset=".5"  stop-color="#fff" stop-opacity=".08" />
      <stop offset="1"   stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="fadeXg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#fff" stop-opacity="0" />
      <stop offset=".25" stop-color="#fff" stop-opacity=".9" />
      <stop offset=".75" stop-color="#fff" stop-opacity=".9" />
      <stop offset="1"   stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <mask id="fadeX" maskContentUnits="userSpaceOnUse"><rect x="10" y="10" width="118" height="40" rx="20.0" fill="url(#fadeXg)" /></mask>
    <filter id="halo" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="5" /></filter>
    <filter id="soft" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="1.4" /></filter>
  </defs>

  <!-- coloured halo, like light leaking from the pill -->
  <rect x="20" y="18" width="98" height="32" rx="16.0" fill="#5b9bff" opacity=".35" filter="url(#halo)" />

  <g clip-path="url(#pill)">
    <rect x="10" y="10" width="118" height="40" rx="20.0" fill="url(#body)" />
    <ellipse cx="69.0" cy="54" rx="56.64" ry="28.0" fill="url(#glow)" />
    <g mask="url(#fadeX)" filter="url(#soft)">
      <rect x="16.0" y="11.4" width="106.0" height="20.0" rx="10.0" fill="url(#sheen)" />
    </g>
  </g>
  <rect x="10.6" y="10.6" width="116.8" height="38.8" rx="19.4" fill="none" stroke="url(#rim)" stroke-width="1.2" />

  <g fill="#5b9bff">
    <g transform="translate(34 30.0)"><text x="0" y="5" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="15" font-weight="700">@</text></g>
    <text x="50" y="35.0" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" letter-spacing=".2">email</text>
  </g>
</svg>

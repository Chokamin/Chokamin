<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="CHOKAMIN — Director of Photography · Content Creator">
  <defs>
    <!-- Focus hunting: blur in and out, then lock sharp -->
    <filter id="focus" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="0">
        <animate attributeName="stdDeviation" dur="1.2s" fill="freeze"
          values="14;5;11;2;6;0" keyTimes="0;0.25;0.45;0.65;0.82;1" />
      </feGaussianBlur>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Arial, sans-serif; }
    .mono { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

    .rec   { animation: blink 1.2s steps(1) infinite; }
    .box   { transform-box: fill-box; transform-origin: center;
             animation: zoom 1.2s cubic-bezier(.2,.8,.2,1) both, dim .8s 2.6s forwards; }
    .box path { animation: lock .01s 1.2s forwards; }
    .af    { animation: lockFill .01s 1.2s forwards; }
    .needle{ animation: meter 1.4s ease-out both; }
    .flash { animation: flash .5s 1.45s ease-out both; }
    .frames{ opacity: 0; animation: show .01s 1.6s forwards; }

    @keyframes blink   { 0%,100% { opacity: 1 } 50% { opacity: 0 } }
    @keyframes zoom    { from { transform: scale(1.7); opacity: 0 } to { transform: scale(1); opacity: 1 } }
    @keyframes dim     { to { opacity: .28 } }
    @keyframes lock    { to { stroke: #4ade80 } }
    @keyframes lockFill{ to { fill: #4ade80 } }
    @keyframes meter   { 0% { transform: translateX(-70px) } 30% { transform: translateX(45px) }
                         55% { transform: translateX(-25px) } 80% { transform: translateX(8px) } 100% { transform: translateX(0) } }
    @keyframes flash   { 0% { opacity: 0 } 15% { opacity: .9 } 100% { opacity: 0 } }
    @keyframes show    { to { opacity: 1 } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Screen -->
  <rect width="1000" height="340" rx="16" fill="#0b0b0b" />

  <!-- Rule of thirds -->
  <g stroke="#fff" stroke-opacity=".06" stroke-width="1">
    <line x1="333" y1="0" x2="333" y2="340" />
    <line x1="667" y1="0" x2="667" y2="340" />
    <line x1="0" y1="113" x2="1000" y2="113" />
    <line x1="0" y1="227" x2="1000" y2="227" />
  </g>

  <!-- Frame corners -->
  <g fill="none" stroke="#e5e5e5" stroke-opacity=".7" stroke-width="2">
    <path d="M28 58 V28 H58" />
    <path d="M942 28 H972 V58" />
    <path d="M28 282 V312 H58" />
    <path d="M942 312 H972 V282" />
  </g>

  <!-- Top bar -->
  <g class="mono" font-size="14" fill="#e5e5e5">
    <circle class="rec" cx="56" cy="56" r="6" fill="#ff3b30" />
    <text x="70" y="61">REC</text>
    <text x="118" y="61" fill="#8a8a8a">TC 00:00:24:08</text>

    <text x="820" y="61" text-anchor="end" fill="#8a8a8a">4K · 24p</text>
    <rect x="836" y="49" width="38" height="16" rx="3" fill="none" stroke="#e5e5e5" stroke-width="1.5" />
    <rect x="874" y="54" width="3" height="6" rx="1" fill="#e5e5e5" />
    <rect x="840" y="53" width="8" height="8" fill="#e5e5e5" />
    <rect x="851" y="53" width="8" height="8" fill="#e5e5e5" />
    <rect x="862" y="53" width="8" height="8" fill="#e5e5e5" />
  </g>

  <!-- Focus box -->
  <g class="box" fill="none" stroke="#f5f5f5" stroke-width="2.5">
    <path d="M270 128 V108 H290" />
    <path d="M710 108 H730 V128" />
    <path d="M270 192 V212 H290" />
    <path d="M710 212 H730 V192" />
  </g>

  <!-- Subject -->
  <g filter="url(#focus)">
    <text class="sans" x="500" y="182" text-anchor="middle" font-size="64" font-weight="600"
          letter-spacing="12" fill="#f5f5f5">CHOKAMIN</text>
  </g>
  <text class="sans" x="500" y="250" text-anchor="middle" font-size="14" letter-spacing="4"
        fill="#8a8a8a">DIRECTOR OF PHOTOGRAPHY  ·  CONTENT CREATOR</text>

  <!-- Bottom bar -->
  <g class="mono" font-size="14" fill="#bdbdbd">
    <text x="56" y="296">ƒ/1.8</text>
    <text x="118" y="296">1/50</text>
    <text x="172" y="296">ISO 800</text>

    <!-- Exposure meter -->
    <g fill="#8a8a8a" font-size="11" text-anchor="middle">
      <text x="420" y="300">-2</text>
      <text x="500" y="300">0</text>
      <text x="580" y="300">+2</text>
    </g>
    <g stroke="#8a8a8a" stroke-width="1.5">
      <line x1="440" y1="291" x2="440" y2="299" /><line x1="460" y1="293" x2="460" y2="297" />
      <line x1="480" y1="291" x2="480" y2="299" /><line x1="520" y1="291" x2="520" y2="299" />
      <line x1="540" y1="293" x2="540" y2="297" /><line x1="560" y1="291" x2="560" y2="299" />
    </g>
    <path class="needle" d="M494 282 L506 282 L500 289 Z" fill="#f5f5f5" />

    <circle class="af" cx="840" cy="291" r="5" fill="#8a8a8a" />
    <text x="852" y="296">AF-C</text>
    <text class="frames" x="944" y="296" text-anchor="end" fill="#8a8a8a">[1]</text>
  </g>

  <!-- Shutter -->
  <rect class="flash" width="1000" height="340" rx="16" fill="#fff" />
</svg>
